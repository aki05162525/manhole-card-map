        var BidImageClickEvent = function () {
            $("#mapArea").find("img").bind("click", function (ev) {
                var aryBoundaryPoint = oConfig.AreaModel[0].ImageIndexmapBoundary.split(",");
                var arySize = oConfig.AreaModel[0].ImageIndexmapSize.split(",");
                var dLeft, dTop, dRight, dButtom;
                dLeft = Number(aryBoundaryPoint[0]);
                dButtom = Number(aryBoundaryPoint[1]);
                dRight = Number(aryBoundaryPoint[2]);
                dTop = Number(aryBoundaryPoint[3]);

                var iWidth = Number(arySize[0]);
                var iHeight = Number(arySize[1]);

                var dPointx, dPointY;
                dPointx = dLeft + ((dRight - dLeft) / iWidth) * iMouseX;
                dPointY = dTop - ((dTop - dButtom) / iHeight) * iMouseY;
                RedirectToPage("Portal", "Map", {
                    mpx: dPointx,
                    mpy: dPointY,
                    bsw: $(window).width(),
                    bsh: $(window).height()
                });
            });

            $("#mapArea").find("img").bind("mousemove", function (ev) {
                var oCoord = GetElementCoord(this, ev);
                iMouseX = oCoord.x;
                iMouseY = oCoord.y;
            });
        };

        var DisplayMajorLandmarkList = function () {
            // 表示されている主要施設を空白に
            var $majorLandmarkList = $("#majorLandmarkList").empty();
            $.ajax({
                "type": "POST"
                , "url": "../FreewordSearch/GetFeatureList"
                , "dataType": "json"
                , "success": function (json)
                {
                    if (!(json && json.JsonResult.Landmarks && json.JsonResult.RecordCount && json.JsonResult.RecordCount > 0)) {
                        this.error();
                        return;
                    }

                    // 取得したデータを表示
                    $.each(json.JsonResult.Landmarks, function (i, majorLandmark)
                    {
                        $listElem = $('<li style="padding-top:1px;">・</li>');
                        $majorLandmarkElem = $('<a href="javascript:void(0);"></a>').text(majorLandmark.Hyoji);
                        // リストのクリックイベント作成
                        $majorLandmarkElem.bind({
                            "click": function ()
                            {
                                RedirectToPage("Portal", "Map", {
                                    "mpx": majorLandmark.X
                                    , "mpy": majorLandmark.Y
                                    , "bsw": $(window).width()
                                    , "bsh": $(window).height()
                                });
                            }
                        });
                        $majorLandmarkElem.appendTo($listElem);
                        $listElem.appendTo($majorLandmarkList);
                        $('#majorLandmarkListArea').css('display','block');
                    });
                }
                , "error": function () {
                    $('#majorLandmarkListArea').remove();
                }
            });
        };

        var getMyPoints = function () {
            // クッキー名をサーバから取得する
            var cookieName = "wagamachi_pub_bkmk";

            // マイポイントの情報をCookieから取得する。
            var cookieValues = document.cookie.split("; ");
            var cookieNameLength = cookieName.length + 1;
            var i = 0;
            var myPointsStr = "";
            while (cookieValues[i]) {
                if (cookieValues[i].substr(0, cookieNameLength) === cookieName + "=") {
                    myPointsStr = cookieValues[i].substr(cookieNameLength, cookieValues[i].length);
                    break;
                }
                i++;
            };

            return (myPointsStr.length == 0) ? new Array() : myPointsStr.split("%00");
        };

        var formatMyPoints = function (myPoints) {
            var myPointsCount = myPoints.length;
            var ret = [];
            for (i = 0 ; i < myPointsCount ; i++) {
                var myPoint = {};
                myPointElements = unescape(myPoints[i]).split(",");
                myPoint.hyoji = myPointElements[0]; // 表示名
                myPoint.mpy = myPointElements[1]; // Y座標
                myPoint.mpx = myPointElements[2]; // X座標
                myPoint.mps = myPointElements[3]; // 縮尺
                ret[ret.length] = myPoint;
            }
            return ret;
        }

        var DisplayMyPoint = function () {
            var $myPointList = $("#myPointList").empty();
            // マイポイントの一覧作成
            var myPoints = formatMyPoints(getMyPoints());
            if (myPoints.length > 0) {
                // マイポイントが登録されている場合
                $.each(myPoints, function (i, myPoint) {
                    // TODO:別途クラス属性を付加する際の名前
                    $listElem = $('<li>・</li>');
                    $myPointElem = $('<a href="javascript:void(0);"></a>').text(myPoint.hyoji);
                    $myPointElem.bind({
                        "click": function () {
                            RedirectToPage("Portal", "Map", {
                                "mpx": myPoint.mpx
                                , "mpy": myPoint.mpy
                                , "mps": myPoint.mps
                                , "bsw": $(window).width()
                                , "bsh": $(window).height()
                            });
                        }
                    });
                    $myPointElem.appendTo($listElem);
                    $listElem.appendTo($myPointList);

            var elemUl = $("#MapSelect");
            elemUl.empty();

                var oMapCt = oConfig.MapWithCtModel.MapCtList[i];

        var buildSectionSelect = function(){
            var $section = $("#section");

            $section.bind('change', function (event) {
                filterBySection();
            });

            var umapSections = oConfig.MapByAuthModel.umapSections
            for(var i in umapSections){
                var section = umapSections[i];
                $section.append('<option value="' + section.SectionCode + '">' + section.SectionName + '</option>');
            }
        };

        var filterBySection = function(){
            var  $carouselWrapper =  $("#myMapArea").find(".carouselWrapper").empty();
            $carouselWrapper.append($('<ul id="myMapAreaCarousel" class="jcarousel-skin"></ul>'));
            var $myMapAreaCarousel = $("#myMapAreaCarousel");
            var size = DisplayMapList(true);
            //$myMapAreaCarousel.jcarousel("size", size);
            //$myMapAreaCarousel.jcarousel("scroll", 0);
            if (size > 5) {
                $('#myMapAreaCarousel').jcarousel({
                    wrap: 'circular',
                    scroll: 5
                });
            } else {
                $('#myMapAreaCarousel').jcarousel({
                    buttonPrevHTML: "<div disabled='disabled' class='jcarousel-prev jcarousel-prev-horizontal jcarousel-prev-disabled jcarousel-prev-disabled-horizontal' style='display: block;'/>",
                    buttonNextHTML: "<div disabled='disabled' class='jcarousel-next jcarousel-next-horizontal jcarousel-next-disabled jcarousel-next-disabled-horizontal' style='display: block;'/>"
                });
            }
        }

        var DisplayMapList = function (filterUMap) {
            // マイマップ一覧[]
            if (oConfig.MapByAuthModel.UMapList.length == 0) {
                $("#myMapArea").hide();
            } else {
                $("#myMapArea").show();
                var sectionVal = $("#section").val();
                var size = 0;
                var elemUl = $("#myMapArea").find("ul");
                elemUl.empty();
                for (var i = 0; i < oConfig.MapByAuthModel.UMapList.length; i++) {
                    var oMap = oConfig.MapByAuthModel.UMapList[i];
                    if(sectionVal == oMap.SectionCode){
                        elemUl.append('<li section=' + oMap.SectionCode + '><a href="javascript:UserMapClick(' +
                        oMap.UmapId + ',' +
                        oMap.DefaultXBLDD + ',' +
                        oMap.DefaultYBLDD + ')">' + oMap.UmapName + '</a></li>');
                        size ++;
                    }
                }
            }

            if (filterUMap) {
                return size;
            }
            // 所管マップ一覧[]
            elemUl = $("#syokanMapArea").find("ul");
            elemUl.empty();

            if (oConfig.LoginInfo.AuthLevel < 5) {
                for (var i = 0; i < oConfig.MapWithCtModel.MapCtList.length; i++) {
                    var oMapCt = oConfig.MapWithCtModel.MapCtList[i];
                    for (var j = 0; j < oMapCt.MapList.length; j++) {
                        var oMapInfo = oMapCt.MapList[j];
                        if (oMapInfo.OwnerSectionCode == oConfig.LoginInfo.SectionCode) {
                            iShokan = iShokan + 1;
                            elemUl.append('<li><a href="../PositionSelect?mid=' + oMapInfo.MapId + '&nm=' + oMapInfo.MapName + '&ctnm=' + oMapCt.MapCtName + '" class="alpha"><img src="' +
                                oMapInfo.ThumbnailPath + '" alt="' +
                                oMapInfo.MapInfo + '">' +
                                '<p>' + oMapInfo.MapName + '</p></a></li>');
                        }
                    }
                }
            }
            if (elemUl[0] == undefined || elemUl[0].children.length == 0) {
                $("#syokanMapArea").hide();
            } else {
                $("#syokanMapArea").show();
            }

            // 主題マップカテゴリ[]
            elemUl = $("#allMapArea").find("div[class='textList']");
            elemUl.empty();
            for (var i = 0; i < oConfig.MapWithCtModel.MapCtList.length; i++) {
                var oMapCt = oConfig.MapWithCtModel.MapCtList[i];
                var sContentHtml = "";
                sContentHtml += '<div class="listWrapper clearfix">';
                sContentHtml += '<h3>' + oMapCt.MapCtName + '</h3>';
                sContentHtml += '<ul class="clearfix">';
                for (var j = 0; j < oMapCt.MapList.length; j++) {
                    var oMapInfo = oMapCt.MapList[j];
                    sContentHtml += '<li><img src="' + oMapInfo.IconPath + '"/><a href="../PositionSelect?mid=' + oMapInfo.MapId + '&nm=' + oMapInfo.MapName + '&ctnm=' + oMapCt.MapCtName + '">' + oMapInfo.MapName + '</a></li>';
                }
                sContentHtml += '</ul>';
                sContentHtml += '</div>';
                elemUl.append(sContentHtml);
            }

            elemUl = $("#allMapCarousel");
            elemUl.empty();

            var sContentHtml = '<li><div class="tabList fixHeight">';
            for (var i = 0; i < oConfig.MapWithCtModel.MapCtList.length; i++) {
                var oMapCt = oConfig.MapWithCtModel.MapCtList[i];
                if (i % 4 == 0) {
                    sContentHtml += '<span class="current"><strong>' + oMapCt.MapCtName + '</strong>';
                } else {
                    sContentHtml += '<span><strong>' + oMapCt.MapCtName + '</strong>';
                }
                sContentHtml += '<div class="detail fixHeightChild">';
                sContentHtml += '<ul class="clearfix">';
                for (var j = 0; j < oMapCt.MapList.length; j++) {
                    var oMapInfo = oMapCt.MapList[j];
                    sContentHtml += '<li><a href="../PositionSelect?mid=' + oMapInfo.MapId + '&nm=' + oMapInfo.MapName + '&ctnm=' + oMapCt.MapCtName + '" class="alpha"><img src="' + oMapInfo.ThumbnailPath + '" alt=""></a></li>';
                    if (j == (Number(oConfig.Property.C01_006) * 4 - 1)) {
                        break;
                    }
                }
                sContentHtml += '</ul>';
                sContentHtml += '</div>';
                sContentHtml += '</span>';
                if ((i + 1) % 4 == 0 && i != oConfig.MapWithCtModel.MapCtList.length - 1) {
                    sContentHtml += '</div></li><li><div class="tabList fixHeight">';
                }
                if (i == oConfig.MapWithCtModel.MapCtList.length - 1) {
                    sContentHtml += '</div></li>';
                }
            }
            sContentHtml += '</li>';
            elemUl.append(sContentHtml);

            elemUl = $("#allMapArea_category").find("ul[class='jcarousel-skin fixHeight']");
            elemUl.empty();
            sContentHtml = "";
            for (var i = 0; i < oConfig.MapWithCtModel.MapCtList.length; i++) {
                var oMapCt = oConfig.MapWithCtModel.MapCtList[i];
                sContentHtml += '<li class="bannerList">';
                sContentHtml += '<h3>' + oMapCt.MapCtName + '</h3>';
                sContentHtml += '<ul>';
                for (var j = 0; j < oMapCt.MapList.length; j++) {
                    var oMapInfo = oMapCt.MapList[j];
                    sContentHtml += '<li><a href="../PositionSelect?mid=' + oMapInfo.MapId + '&nm=' + oMapInfo.MapName + '&ctnm=' + oMapCt.MapCtName + '" class="alpha"><img src="' + oMapInfo.ThumbnailPath + '" alt=""><p>' + oMapInfo.MapName + '</p></a></li>';
                    if (j == (Number(oConfig.Property.C01_005) - 1)) {
                        sContentHtml += '<p><a href="../MapSelect?mcid=' +
                            oMapCt.MapCtId + '" class="mapSelector fancybox.iframe"><img src="./Content/images/pages/top/btn_more_off.jpg" alt="もっと見る"></a></p>';
                        break;
                    }
                }
                sContentHtml += '</ul>';
                sContentHtml += '</li>';
            }
            elemUl.append(sContentHtml);
        };

            if (oConfig.AreaModel.length > 0) {
                var sImgSize = oConfig.AreaModel[0].ImageIndexmapSize;
                var imgObj = $("<img>").attr("src", oConfig.AreaModel[0].ImageIndexmap);
                imgObj.appendTo($("#mapArea"));
                $("#mapArea").find("img").css("width", sImgSize.split(",")[0]);
                $("#mapArea").find("img").css("height", sImgSize.split(",")[1]);

        var DisplayNews = function () {
            var C04_003 = "2";

            //お知らせがないときは非表示
            if(C04_003 == "2" && (oConfig == null || oConfig.WhatsNewModel == null || oConfig.WhatsNewModel.MessageList == null || oConfig.WhatsNewModel.MessageList.length == 0)) {
                $(".bdrNews").hide();
            }

            var elemNewsUl = $("#news").find("ul");
            elemNewsUl.empty();
            for (var i = 0; i < oConfig.WhatsNewModel.MessageList.length; i++) {
                var oMessage = oConfig.WhatsNewModel.MessageList[i];
                var sHtml = "";
                var style = '';
                sHtml += '<li class="clearfix">';
                if (oMessage.PriorityLevel == 9) {
                    style = 'style=color:red';
                } else if (oMessage.PriorityLevel == 1) {
                    style = 'style=color:green';
                }
                if (C04_003 == "0" || C04_003 == "2") {
                    sHtml += '<span ' + style + '>' + DateFormart(oMessage.StartDate) + '</span><br/>';
                    sHtml += '<p ' + style + '>' + HTMLEncode(oMessage.Body) + '</p>';
                    if (oMessage.LinkUrlValue != null && oMessage.LinkUrlAlias != null
                        && oMessage.LinkUrlValue.length > 0 && oMessage.LinkUrlAlias.length > 0) 
                    {
                        if (String(oMessage.LinkUrlValue).substring(0, 4) == "http" ||
                            String(oMessage.LinkUrlValue).substring(0, 5) == "https") 
                        {
                            sHtml += '<p ' + style + '><a href="javascript:void(0);" onclick="javascript:window.open(\'' +
                                oMessage.LinkUrlValue + '\')">' +
                                oMessage.LinkUrlAlias + '</a></p>';
                        } else {
                            sHtml += '<p ' + style + '>' + oMessage.LinkUrlAlias + '</p>';
                        }
                    }
                } else if (C04_003 == "1") {
                    sHtml += '<div>';
                    sHtml += '<span ' + style + '>' + DateFormart(oMessage.StartDate) + '</span>';
                    sHtml += '<p ' + style + '>' + HTMLEncode(oMessage.Title);
                    if (oMessage.Body.length > 50) {
                        sHtml += '<p ' + style + '>' + HTMLEncode(oMessage.Body.substring(0, 50));
                        sHtml += '……<a href="javascript:void(0);" onclick="ChangeNewsMode(this);" >[詳細表示▽]</a>';
                        sHtml += '</p>';
                    } else {
                        sHtml += '<p ' + style + '>' + HTMLEncode(oMessage.Body) + '</p>';
                    }
                    sHtml += '</div>';

                    sHtml += '<div hidden="hidden">';
                    sHtml += '<span ' + style + '>' + DateFormart(oMessage.StartDate) + '</span>';
                    sHtml += '<p ' + style + '>' + HTMLEncode(oMessage.Title);
                    sHtml += '<p ' + style + '>' + HTMLEncode(oMessage.Body) + '</p>';
                    if (oMessage.LinkUrlValue != null && oMessage.LinkUrlAlias != null
                        && oMessage.LinkUrlValue.length > 0 && oMessage.LinkUrlAlias.length > 0) 
                    {
                        if (String(oMessage.LinkUrlValue).substring(0, 4) == "http" ||
                            String(oMessage.LinkUrlValue).substring(0, 5) == "https") 
                        {
                            sHtml += '<p ' + style + '><a href="javascript:void(0);" onclick="javascript:window.open(\'' +
                                oMessage.LinkUrlValue + '\')">' +
                                oMessage.LinkUrlAlias + '</a></p>';
                        } else {
                            sHtml += '<p ' + style + '>' + oMessage.LinkUrlAlias + '</p>';
                        }
                    }
                    sHtml += '<p><a href="javascript:void(0);" onclick="ChangeNewsMode(this);" >[戻す△]</a></p>';
                    sHtml += '</div>';
                }

                sHtml += '</li>';
                elemNewsUl.append(sHtml);
            }
        };

        var ChangeNewsMode = function (obj) {
            $(obj).parent().parent().parent().find("div").each(function (e) {
                $(this).toggle();
            });
        };

        var DateFormart = function (sDate) {
            var oDate = new Date(sDate);
            if (isNaN(oDate)) {
                oDate = new Date(sDate.replace(/-/ig, '/'));
            }
            return oDate.getFullYear() + "-" + (oDate.getMonth() + 1) + "-" + oDate.getDate();
        };

        var ChangeCs = function (sValue) {
            var elemCheckBox = $("#SearchForm").find('input[type="checkbox"]')[0];
            $("#SearchForm").find('input[name="cs"]').val(sValue);
            $("#SearchForm").find('input[name="adm"]').val(elemCheckBox.checked);
            $("#SearchForm").submit();
        };

        var ChangeAdm = function () {
            var elemCheckBox = $("#SearchForm").find('input[type="checkbox"]')[0];
            $("#SearchForm").find('input[name="adm"]').val(elemCheckBox.checked);
        };
        var openZoomSight = function()
        {
            location.href = '/zsmd/lang/ja/html/index.html';
        };

        var $createLinkFromMapCtListItem = function(){
          var langmodeParam = "";
          var langmode = "0";
          if (langmode != 0) {
              langmodeParam = '&langmode=' + langmode;
          }
          if (this.MapList.length > 1) {
            return $('<a></a>')
              .attr({'href': '../MapSelect?mcid=' + this.MapCtId +langmodeParam})
              .addClass('mapSelector')
              .addClass('fancybox.iframe');
          }
          return $('<a></a>')
            .attr({
              'href': '../PositionSelect'
              + '?mid=' + this.MapList[0].MapId
              + '&nm=' + this.MapList[0].MapName
              + '&ctnm=' + this.MapCtName
              + langmodeParam
            });
        };
        function closeFancyboxAndRedirectToUrl(sLayerType, mapId, layerId) {
            $.fancybox.close();

            if (layerId != undefined) {
                if (sLayerType == "theme") {
                    RedirectToPage('Portal', 'Map', { mid: mapId, tmtl: layerId });
                } else {
                    RedirectToPage('Portal', 'Map', { mid: mapId, tmul: layerId });
                }
            } else if (sLayerType == "theme") {
                RedirectToPage('Portal', 'PositionSelect', { mid: mapId });
            } else {
                RedirectToPage('Portal', 'Map', { mid: mapId });
            }
        };
        var DisplayMapCtList = function(){
          var map_number = 1;
          $(oConfig.MapWithCtModel.MapCtList).each(function(){
            $('div.wrapSecond').append(
              $('<section></section>').addClass('boxModule').addClass('bdrMap').append(
                $createLinkFromMapCtListItem.apply(this).append(

                $('<p></p>').text(this.MapCtInfo),

                $('<div></div>').addClass('imageMap').addClass('map' + map_number).addClass('mapct' + this.MapCtId).text(this.MapCtName + '画面').css({'background':'url(./Content/images/site/'+this.MapCtThumbnailPath+') 50% 50% no-repeat,url(./Content/images/site/thumMapDefault.png) 50% 50% no-repeat'}),
                $('<div></div>').addClass('linkSearchmap').text('地図検索')
                )
              )
            )
            map_number += 1;
          });
          
          
          var urlMappinDrop = "https://mappindrop.info-mapping.com/shinjo/main.html";
          if (urlMappinDrop != ""){
          $('div.wrapSecond').append($('<section class="boxModule bdrMap boxMappinDrop"></section>')
              .append($('<a href="' + urlMappinDrop + '" target="MappinDrop"></a>')
              .append('<h2><span class="ico"></span>Mappin\'Drop</h2>')
              .append('<div class="imageMap mpd"></div>')
              )
          )
          }

            var sp_url = oConfig.LoginInfo.DomainPathSp + oConfig.LoginInfo.VirtualPathSp + '/';
            var pc_url = oConfig.LoginInfo.DomainPathPublic + oConfig.LoginInfo.VirtualPathPublic + '/';
            if (0 >= 1) {
                sp_url = sp_url + "?langmode=" + 0
                pc_url = pc_url + "?langmode=" + 0
            }
            $('div.wrapSecond').append($('<section class="boxModule boxQr"></section>')
                .append('<h2 class="mdsQr"><div class="pc">スマートフォンサイトはこちら</div></h2>')
                .append('<div class="pc"><a href="' + sp_url + '"><img alt="二次元コード" src="../Link/GetQRImage?url=' + sp_url + '"></a><p>二次元コードをお読みください。<br />（一部未対応の機種があります）</p></div>')
                
            )
        }

        function SetSearchUrl() {
            var h = function (e) { e.preventDefault(); }

            $("#layerSearch")
            .on('click', h)
            .click(function () {
                var $this = $(this);
                // 検索語句の取得
                var $layerSkw = $("#layer_skw");
                var layerSkwTxt = $layerSkw.val();
                var skw = ($layerSkw.attr("placeholder") != layerSkwTxt) ? layerSkwTxt : "";

                // ページ遷移
                switch ($("input[name='searchMode']:checked").val()) {
                    case "section":
                        skw = "../SectionSearch?skw=" + skw;
                        break;
                    case "map":
                        skw = "../MapSearch?skw=" + skw;
                        break;
                    default:
                        skw = "../LayerSearch?skw=" + skw;
                        break;
                }

                $this.attr("href", skw);
                $this.off('click', h);

                $("#freeword-form").innerHeight($("#sectionword-form").innerHeight());
            });
        };
