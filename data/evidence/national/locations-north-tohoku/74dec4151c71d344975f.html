google.maps.event.addDomListener(window, 'load', mapsLoaded);

function mapsLoaded() {
	latlng = new google.maps.LatLng(gmConfig.lat, gmConfig.lng);
	var myOptions = {
		zoom: gmConfig.zoom,
		center: latlng,
		mapTypeId: google.maps.MapTypeId.ROADMAP,
		streetViewControl:gmConfig.streetView
	};

	map = new google.maps.Map(document.getElementById(gmConfig.ID), myOptions);

	// 現在地取得
	var positionOptions = {
		enableHighAccuracy: true
	};
	var geo = navigator.geolocation || google.gears.factory.create('beta.geolocation');
	if( geo ) {
		geo.getCurrentPosition(
			function(position) {
				currentLatlng = new google.maps.LatLng(position.coords.latitude, position.coords.longitude);
				getCurrentFlag = 1;
				document.getElementById('startloc').setAttribute('placeholder', '現在地');
				document.getElementById('btnNearMap').style.display = 'block';
			},
			function(error) { 
				switch( error.code ) { 
					case 1:
						//alert('位置情報の利用が許可されていません');
						break;
					case 2:
						alert('デバイスの位置が判定できません');
						break;
					case 3:
						alert('タイムアウトしました');
						break;
				}
			},
			positionOptions
		);
	} else { 
		alert('このブラウザでは位置取得が出来ません。');
	}
	marker = new google.maps.Marker({
		position: latlng,
		map: map,
		title: gmConfig.marker.title
	});

	if( gmConfig.directions ) {
		setDirections();
		map_direction();
	}

	infoWin = new google.maps.InfoWindow({
		content: gmConfig.iw.content + ((gmConfig.directions) ? direction_html.to : '')
	});
	infoWin.open(map,marker);

	google.maps.event.addListener(marker, 'click', function() {
		if( infoWin ) infoWin.close();
		infoWin = new google.maps.InfoWindow({
			content: gmConfig.iw.content + ((gmConfig.directions) ? direction_html.to : '')
		});
		infoWin.open(map,marker);
	});
}

// functions that open the directions forms
function tohere() {
	if(infoWin) infoWin.close();
	infoWin = new google.maps.InfoWindow({
		content: gmConfig.iw.content + direction_html.to
	});
	infoWin.open(map,marker);
}

// Directions
function setDirections() {
	var gmap = document.getElementById("gmap");
	var directionsDiv = document.getElementById("directions");
	//close button
	closeDirection = document.createElement('div');
	closeDirection.innerHTML = '×';
	closeDirection.id = 'closeDirection';
	closeDirection.style.border = 'solid 1px #000';
	closeDirection.style.display = 'none';
	closeDirection.style.cursor = 'pointer';
	directionsDiv.appendChild(closeDirection);
	
	closeDirection.onclick = function() {
		this.style.display = (this.style.display == 'none') ? 'block' : 'none';
		
		directionsDisplay.setMap(null);
		directionsDisplay.setPanel(null);
		directionsDisplay = new google.maps.DirectionsRenderer();
		directionsDisplay.setMap(map);
		directionsDisplay.setPanel(directionsDiv); 
		directionsDiv.style.display = 'none';
		gmap.style.width = '100%';
		gmap.style.height = '100%';
		
		if (infoWin) infoWin.close();
		map.setCenter(latlng);
	};

	directionsService = new google.maps.DirectionsService();
	directionsDisplay = new google.maps.DirectionsRenderer();
	directionsDisplay.setMap(map);
	directionsDisplay.setPanel(directionsDiv);
}

function getDirections() {
	var opts = {};
	var mode = google.maps.DirectionsTravelMode.DRIVING;
	var gmap = document.getElementById("gmap");
	var directionsDiv = document.getElementById("directions");
	
	opts.locale = 'ja';
	
	// 徒歩
	if( document.getElementById('walk').checked ) {
	   mode = google.maps.DirectionsTravelMode.WALKING;
	}

	// 自転車
	//if( document.getElementById("bicycling").checked ) {
	//	mode = google.maps.DirectionsTravelMode.BICYCLING;
	//}
	
	// 車
	if( document.getElementById('drive').checked ) {
	   mode = google.maps.DirectionsTravelMode.DRIVING;
	}
	
	// 高速
	if( document.getElementById('highways').checked ) {
		var highways = true;
	} else {
		var highways = false;
	}
	
	// 有料道路
	if( document.getElementById('tollroads').checked ) {
		var tolls = true;
	} else {
		var tolls = false;
	}
	
	// ==== set the start and end locations ====
	if( (document.getElementById('startloc').value == '') && (currentLatlng != '') && getCurrentFlag ) {
		var startloc = currentLatlng;
	} else {
		var startloc = document.getElementById('startloc').value;
	}
	var endloc = document.getElementById('endloc').value;

	var request = {
		origin: startloc, 
		destination: endloc,
		travelMode: mode,
		avoidHighways: highways,
		avoidTolls: tolls
	};
	
    directionsService.route(request, function(response, status) {
		if (status == google.maps.DirectionsStatus.OK) {
			closeDirection.style.display = 'block';
			directionsDiv.style.display = 'block';
			directionsDiv.style.width = "25%";
			directionsDiv.style.height = "100%";
			gmap.style.width = "75%";
			gmap.style.height = "100%";
			directionsDisplay.setDirections(response);
		} else {
			var error_msg = "";
	      	switch( status ) {
	      		case "INVALID_REQUEST":
	      			error_msg = "リクエストが無効です。";
	      			break;
	      		case "MAX_WAYPOINTS_EXCEEDED":
	      			error_msg = "経由地点が8を超えました。";
	      			break;
	      		case "NOT_FOUND":
	      			error_msg = "場所が見つかりません。";
	      			break;
	      		case "OVER_QUERY_LIMIT":
	      			error_msg = "リクエストの制限回数を超えました。";
	      			break;
	      		case "REQUEST_DENIED":
	      			error_msg = "ルート検索は使用できません。";
	      			break;
	      		case "ZERO_RESULTS":
	      			error_msg = "ルートが見つかりません。";
	      			break;
	      		case "UNKNOWN_ERROR":
	      			error_msg = "サーバエラー。リトライしてください。";
	      			break;
	      	}
		  	alert(error_msg);
		}
    });
}
