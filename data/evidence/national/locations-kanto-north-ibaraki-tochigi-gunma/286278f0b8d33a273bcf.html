<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>メンテナンスのお知らせ</title>
<style>
  :root {
    --bg: #f5f5f3;
    --surface: #ffffff;
    --text: #222;
    --muted: #666;
    --border: #e4e4e0;
    color-scheme: light;
  }
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px 16px;
    background: var(--bg);
    color: var(--text);
    font-family: "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Noto Sans JP", "Yu Gothic", YuGothic, Meiryo, sans-serif;
    -webkit-font-smoothing: antialiased;
    font-feature-settings: "palt";
  }
  .card {
    width: 100%;
    max-width: 640px;
    padding: 52px 48px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
  }
  .title {
    margin: 0 0 20px;
    font-size: 23px;
    font-weight: 700;
    line-height: 1.6;
    letter-spacing: 0.04em;
  }
  .text + .text { margin-top: 20px; }
  .info {
    margin-top: 32px;
    padding-top: 24px;
    border-top: 1px solid var(--border);
  }
  .info-title {
    margin: 0 0 8px;
    font-size: 15px;
    font-weight: 700;
    line-height: 1.8;
  }
  .text {
    margin: 0;
    font-size: 15px;
    line-height: 2;
    letter-spacing: 0.03em;
    color: var(--muted);
    word-break: auto-phrase;
  }
  .text span { display: inline-block; }
  @media (max-width: 480px) {
    .card { padding: 40px 24px; }
    .title { font-size: 20px; }    .text { font-size: 14px; }
  }
</style>
</head>
<body>
  <main class="card">
    <h1 class="title">メンテナンスのお知らせ</h1>
    <p class="text">お客さまの情報とサービスの安全を守るための予防措置として、メンテナンスを実施しております。</p>
    <p class="text">今回のメンテナンスは、システムで利用しているPHPに重大な脆弱性が確認されたことを受けたものです。<br>現時点で、この脆弱性に起因する不正アクセスや情報漏えいは確認されておりません。</p>
    <p class="text">緊急のメンテナンスとなり、ご不便をおかけしておりますことを重ねてお詫び申し上げます。</p>
    <div class="info">
      <h2 class="info-title">■実施日時</h2>
      <p class="text">メンテナンス開始日時：2026年10月21日（水）21:00～<br>メンテナンス終了日時：決まり次第、当ページにてお知らせいたします。</p>
    </div>
  </main>
</body>
</html>
