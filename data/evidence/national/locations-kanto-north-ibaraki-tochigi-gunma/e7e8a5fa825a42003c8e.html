<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="viewport" content="initial-scale=1.0, initial-scale=no">
<title>ふるさと博物館 - 下妻市公式ホームページ</title>
<link rel="stylesheet" href="skin/common/css/global.css" type="text/css" media="all">
<script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyBRruxm9Psbr4VS9IdrnTsOhw256Y5umKA"></script>
<style>
html, body { height: 100%; margin: 0; padding: 0; }
</style>
<script>
//<![CDATA[
	google.maps.event.addDomListener(window, 'load', function() {
		var myOptions = {
			zoom: 15,
			center: new google.maps.LatLng(36.194832503826, 139.94245290756),
			mapTypeId: google.maps.MapTypeId.ROADMAP,
			scaleControl: true
		};

		// マップの生成
		var mapCanvas = new google.maps.Map(document.getElementById('map'), myOptions);

		// マーカーの生成
		var marker = new google.maps.Marker({
			position: new google.maps.LatLng(36.1948325038259, 139.942452907562),
			map: mapCanvas
		});

		// 吹き出し表示処理
		var infoWin = new google.maps.InfoWindow({
			content: '<div class="mapInfoWindow"><div class="mapInfoWindowTitle">ふるさと博物館</div><div class="mapInfoWindowImage"><a href="https://www.city.shimotsuma.lg.jp/data/map/1361344979_391.jpg" target="_blank"><img src="https://www.city.shimotsuma.lg.jp/data/map/1361344979_391.jpg" alt="施設：ふるさと博物館"></a></div><div class="mapInfoWindowContents">住所：下妻市長塚乙77<br />TEL：0296-44-7111</div><div class="mapRouteLink"><a href="https://www.city.shimotsuma.lg.jp/map_route.php?code=15" target="_blank">ルート案内</a></div></div>',
			cornerRadius: 12
		});
		infoWin.open(mapCanvas, marker);

		// クリック時に吹き出し表示
		google.maps.event.addListener(marker, 'click', function() {
			infoWin.open(mapCanvas, marker);
		});
	});
//]]>
</script>
</head>
<body>
	<div id="map" style="width: 100%; height: 100%;"></div>
</body>
</html>
