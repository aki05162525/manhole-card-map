<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="viewport" content="initial-scale=1.0, initial-scale=no">
<title>一中地区公民館 - 土浦市公式ホームページ</title>
<link rel="stylesheet" href="skin/common/css/global.css" type="text/css" media="all">
<script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyB4swKtkrOmbbPb2EMuKbYVScIuicancsk"></script>
<style>
html, body { height: 100%; margin: 0; padding: 0; }
</style>
<script>
//<![CDATA[
	google.maps.event.addDomListener(window, 'load', function() {
		var myOptions = {
			zoom: 15,
			center: new google.maps.LatLng(36.082835155374, 140.19711256027),
			mapTypeId: google.maps.MapTypeId.ROADMAP,
			scaleControl: true
		};

		// マップの生成
		var mapCanvas = new google.maps.Map(document.getElementById('map'), myOptions);

		// マーカーの生成
		var marker = new google.maps.Marker({
			position: new google.maps.LatLng(36.0828351553735, 140.197112560272),
			map: mapCanvas
		});

		// 吹き出し表示処理
		var infoWin = new google.maps.InfoWindow({
			content: '<div class="mapInfoWindow"><div class="mapInfoWindowTitle">一中地区公民館</div><div class="mapInfoWindowImage"><a href="https://www.city.tsuchiura.lg.jp/data/map/1453443540_159.jpg" target="_blank"><img src="https://www.city.tsuchiura.lg.jp/data/map/1453443540_159.jpg" alt="施設：一中地区公民館"></a></div><div class="mapInfoWindowContents"><p>一中地区公民館<br>土浦市大手町13番9号<br>【TEL】<a href=\"tel:0298210104\">029-821-0104</a><br>【FAX】029-821-0193</p></div><div class="mapRouteLink"><a href="https://www.city.tsuchiura.lg.jp/map_route.php?code=1" target="_blank">ルート案内</a></div></div>',
			cornerRadius: 12
		});
		infoWin.open(mapCanvas, marker);

		// クリック時に吹き出し表示
		google.maps.event.addListener(marker, 'click', function() {
			infoWin.open(mapCanvas, marker);
		});
	});
//]]>
</script>
</head>
<body>
	<div id="map" style="width: 100%; height: 100%;"></div>
</body>
</html>
