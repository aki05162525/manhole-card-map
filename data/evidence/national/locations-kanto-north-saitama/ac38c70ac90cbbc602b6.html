<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>メンテナンス中 | AEON</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --color-brand:    #c8007a;
      --color-bg:       #ffffff;
      --color-surface:  #f7f7f7;
      --color-border:   #e8e8e8;
      --color-text:     #1a1a1a;
      --color-muted:    #888888;
    }

    html, body {
      height: 100%;
    }

    body {
      font-family: 'Noto Sans JP', sans-serif;
      background-color: var(--color-bg);
      color: var(--color-text);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
    }

    /* ─── top accent line ─── */
    body::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      background-color: var(--color-brand);
    }

    /* ─── card ─── */
    .card {
      background-color: var(--color-bg);
      border: 1px solid var(--color-border);
      border-radius: 4px;
      padding: 56px 64px 52px;
      max-width: 560px;
      width: 100%;
      text-align: center;
    }

    /* ─── logo ─── */
    .logo {
      display: block;
      margin: 0 auto 44px;
      height: 36px;
      width: auto;
    }

    /* ─── divider ─── */
    .divider {
      width: 32px;
      height: 2px;
      background-color: var(--color-brand);
      margin: 0 auto 32px;
    }

    /* ─── icon ─── */
    .icon-wrap {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background-color: var(--color-surface);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 28px;
    }

    .icon-wrap svg {
      width: 26px;
      height: 26px;
      stroke: var(--color-brand);
      fill: none;
      stroke-width: 1.6;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* ─── heading ─── */
    h1 {
      font-size: 20px;
      font-weight: 500;
      letter-spacing: 0.06em;
      color: var(--color-text);
      margin-bottom: 16px;
      line-height: 1.5;
    }

    /* ─── body text ─── */
    .message {
      font-size: 14px;
      font-weight: 300;
      color: var(--color-muted);
      line-height: 1.9;
      margin-bottom: 36px;
    }

    /* ─── info box ─── */
    .info-box {
      background-color: var(--color-surface);
      border-left: 3px solid var(--color-brand);
      border-radius: 2px;
      padding: 16px 20px;
      text-align: left;
      margin-bottom: 36px;
    }

    .info-box .label {
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 0.12em;
      color: var(--color-brand);
      text-transform: uppercase;
      margin-bottom: 6px;
    }

    .info-box .value {
      font-size: 14px;
      font-weight: 400;
      color: var(--color-text);
      line-height: 1.6;
    }

    /* ─── footer ─── */
    .footer {
      font-size: 11px;
      color: var(--color-border);
      letter-spacing: 0.08em;
    }

    /* ─── responsive ─── */
    @media (max-width: 480px) {
      .card {
        padding: 40px 28px 36px;
      }

      h1 {
        font-size: 18px;
      }
    }
  </style>
</head>
<body>

  <main>
    <div class="card" role="main">

      <!-- Logo -->
      <img
        src="https://hebbkx1anhila5yf.public.blob.vercel-storage.com/image-tNy4fRpHgPSsPfo6jOCQgQ56XSHDVx.png"
        alt="AEON"
        class="logo"
      />

      <div class="divider" aria-hidden="true"></div>

      <!-- Icon -->
      <div class="icon-wrap" aria-hidden="true">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <!-- wrench + gear hint -->
          <circle cx="12" cy="12" r="3" />
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z" />
        </svg>
      </div>

      <!-- Heading -->
      <h1>ただいまメンテナンス中です。</h1>

      <!-- Message -->
      <p class="message">
        現在、緊急メンテナンスを実施中です。<br>
        メンテナンス終了後、改めてご利用ください。
      </p>

      <!-- Footer note -->
      <p class="footer">© AEON CO., LTD. ALL RIGHTS RESERVED.</p>

    </div>
  </main>
<!-- -->
</body>
</html>
