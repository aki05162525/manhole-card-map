山學鐵道館網站的使用條款及隱私政策，詳細說明用戶的權利和義務。","網站政策｜津山學鐵路館","manabi\u002Ftw\u002Fpolicy","a71bdbba-b6cf-4b4d-888c-523413ebabc8",[1712,1713],{"head":1763,"id":1767,"type":142,"uuid":1768,"symbolIds":1769},{"lang":1015,"meta":1764,"title":1766},{"description":1765},"津山学 철도관은 소중한 철도 차량과 역사적인 전시를 통해 철도의 매력을 체험할 수 있는 시설입니다. D51형 증기 기관차와 구 津山 원형 기관차고 등 철도 팬이 꼭 봐야 할 전시와 이벤트를 개최합니다. 가족 단위나 철도 애호가들에게 추천하는 관광 명소입니다.","츠야마 마나비노 철도관","manabi\u002Fko","eedc5a79-e276-4f3e-a5d6-64d692381f25",[1770,1771],"43575fc2-f9cb-4ea1-a1ef-8837cc3ede91","548d3019-83bc-450c-a3e3-f282f59927e0",{"head":1773,"id":1777,"type":142,"uuid":1778,"symbolIds":1779},{"lang":1015,"meta":1774,"title":1776},{"description":1775},"津山学 철도관에서 개최되는 최신 이벤트 일정을 안내합니다. 특별 전시 및 워크숍 등 철도 팬이나 가족이 함께 즐길 수 있는 이벤트 정보를 제공합니다.","이벤트 일정｜츠야마 마나비노 철도관","manabi\u002Fko\u002Fcalendar","2fbe661d-6864-40f0-bdcc-aa6e5bb8d26f",[1771,1770],{"head":1781,"id":1785,"type":142,"uuid":1786,"symbolIds":1787},{"lang":1015,"meta":1782,"title":1784},{"description":1783},"津山学 철도관의 이용 안내를 정리했습니다. 개관 시간, 입장료, 교통 수단 등 방문 전에 유용한 정보를 제공합니다.","이용 안내｜츠야마 마나비노 철도관","manabi\u002Fko\u002Fguide","6c222a90-797a-4e20-b929-cc9d7fee4a5e",[1771,1770],{"head":1789,"id":1793,"type":142,"uuid":1794,"symbolIds":1795},{"lang":1015,"meta":1790,"title":1792},{"description":1791},"津山学 철도관의 마치나미 룸에서는 철도의 역사와 마을 풍경 변화를 전시하고 있습니다. 지역 철도 문화를 배울 수 있는 공간입니다.","마치나미 룸｜츠야마 마나비노 철도관","manabi\u002Fko\u002Fmachinami","19e25c1f-1161-4850-b8ac-6f1cd5708b18",[1771,1770],{"head":1797,"id":1801,"type":142,"uuid":1802,"symbolIds":1803},{"lang":1015,"meta":1798,"title":1800},{"description":1799},"구 津山 원형 기관차고의 역사와 역할에 대해 설명합니다. 보존된 소중한 차량과 그 기술적 특징을 소개합니다.","구 츠야마 기관차고에 대해｜츠야마 마나비노 철도관","manabi\u002Fko\u002Fhouse","def4099f-d6d9-420c-b673-6e7b50687e3f",[1771,1770],{"head":1805,"id":1809,"type":142,"uuid":1810,"symbolIds":1811},{"lang":1015,"meta":1806,"title":1808},{"description":1807},"津山学 철도관에 관한 자주 묻는 질문입니다. 방문 전 궁금한 점과 시설 이용에 관한 기본 정보를 확인할 수 있습니다.","자주 묻는 질문｜츠야마 마나비노 철도관","manabi\u002Fko\u002
