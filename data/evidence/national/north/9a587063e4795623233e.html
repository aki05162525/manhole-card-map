<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>メンテナンス中</title>
<style>
  body { margin: 0; font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic", Meiryo, sans-serif; background: #f5f5f5; color: #333; }
  .box { max-width: 560px; margin: 80px auto; padding: 40px 28px; background: #fff; border-radius: 8px; text-align: center; line-height: 1.9; }
  h1 { font-size: 22px; margin: 0 0 20px; }
  p { margin: 0 0 12px; font-size: 15px; }
  .small { font-size: 13px; color: #777; margin-top: 24px; }
</style>
</head>
<body>
  <div class="box">
    <h1>ただいまメンテナンス中です</h1>
    <p>現在、ホームページのメンテナンスを行っております。</p>
    <p>ご不便をおかけいたしますが、<br>しばらくお待ちくださいますようお願い申し上げます。</p>
    <p class="small">よろーな管理室</p>
  </div>
</body>
</html>
