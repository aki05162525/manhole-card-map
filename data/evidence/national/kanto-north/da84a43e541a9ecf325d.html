  <style>
    :root { color-scheme: light; --ink: #242424; --link: #28785f; }
    *, *::before, *::after { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body { margin: 0; min-height: 100vh; min-height: 100svh; background: #fff; color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
      line-height: 1.9; }
    main { min-height: 100vh; min-height: 100svh; display: grid; place-items: center; padding: 52px 24px 64px; }
    .notice { width: 100%; max-width: 850px; text-align: center; }
    .logo { display: block; width: 270px; max-width: 75%; height: auto; margin: 0 auto 74px; }
    h1 { margin: 0 0 53px; font-size: clamp(24px, 2.4vw, 29px); font-weight: 700; line-height: 1.55; letter-spacing: .035em; }
    .message { font-size: 16px; line-height: 2; letter-spacing: .015em; }
    .message p { margin: 0 0 22px; }
    .message p:last-child { margin-bottom: 0; }
    .updates { margin: 48px 0 0; font-size: 16px; line-height: 1.9; }
    a { color: var(--link); font-weight: 600; text-underline-offset: .2em; text-decoration-thickness: 1px; }
    a:hover { text-decoration-thickness: 2px; }
    a:focus-visible { outline: 2px solid var(--link); outline-offset: 5px; border-radius: 2px; }
    @media (max-width: 600px) {
      main { padding: 52px 22px 58px; }
      .logo { width: 228px; max-width: 80%; margin-bottom: 58px; }
      h1 { font-size: 23px; margin-bottom: 35px; }
      .message { font-size: 15px; line-height: 2; }
      .message p { margin-bottom: 22px; }
      /* Keep intentional line breaks on mobile as well as desktop. */
      .updates { font-size: 14px; margin-top: 36px; }
    }
    @media (max-width: 350px) {
      main { padding-left: 18px; padding-right: 18px; }
      h1 { font-size: 21px; }
      .message, .updates { font-size: 13.5px; }
    }
  </style>
