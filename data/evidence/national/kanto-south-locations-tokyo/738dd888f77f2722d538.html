<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <title>メンテナンスのお知らせ | TOKYO mizumachi</title>
    <style>
        :root {
            --bg: #ffffff;
            --text: #222a35;
            --muted: #5d6877;
            --line: #dfe4ea;
            --accent: #1f4e8c;
            --panel: #f5f7fa;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #141a22;
                --text: #e8ecf1;
                --muted: #a2adbb;
                --line: #2b3441;
                --accent: #7fb0ea;
                --panel: #1b232d;
            }
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            height: 100%;
        }

        body {
            margin: 0;
            display: flex;
            flex-direction: column;
            background: var(--bg);
            color: var(--text);
            font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic", "Meiryo", sans-serif;
            line-height: 1.9;
            -webkit-text-size-adjust: 100%;
        }

        header {
            padding: 20px 24px;
            border-bottom: 1px solid var(--line);
        }

        .brand {
            font-size: 1rem;
            font-weight: 700;
            letter-spacing: .04em;
        }

        main {
            flex: 1;
            width: 100%;
            max-width: 720px;
            margin: 0 auto;
            padding: 72px 24px 56px;
        }

        h1 {
            margin: 0 0 28px;
            padding-left: 16px;
            border-left: 4px solid var(--accent);
            font-size: clamp(1.5rem, 4.5vw, 2rem);
            line-height: 1.4;
            letter-spacing: .02em;
        }

        p {
            margin: 0 0 1.2em;
        }

        .panel {
            margin: 36px 0;
            padding: 20px 24px;
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 4px;
        }

        dl {
            margin: 0;
        }

        dt {
            margin-top: 12px;
            font-size: .85rem;
            font-weight: 700;
            color: var(--muted);
        }

        dt:first-child {
            margin-top: 0;
        }

        dd {
            margin: 0;
        }

        .note {
            font-size: .9rem;
            color: var(--muted);
        }

        footer {
            padding: 20px 24px;
            border-top: 1px solid var(--line);
            text-align: center;
            font-size: .8rem;
            color: var(--muted);
        }

        @media (max-width: 480px) {
            main {
                padding-top: 48px;
            }

            .panel {
                padding: 16px 18px;
            }
        }
    </style>
</head>

<body>

    <header>
        <div class="brand">TOKYO mizumachi | 東武タウンソラマチ株式会社</div>
    </header>

    <main>
        <h1>ただいまメンテナンス中です</h1>

        <p>
            平素より当サイトをご利用いただき、誠にありがとうございます。<br>
    現在、セキュリティ対策のため、サイトを一時的に停止しております。
        </p>
        <p>
            ご利用の皆様にはご不便をおかけし、誠に申し訳ございません。<br>
    対応が完了次第、サービスを再開いたします。
        </p>

        <div class="panel">
            <dl>
                <dt>再開の見込み</dt>
                <dd>決まり次第、このページでお知らせします</dd>
            </dl>
        </div>
    </main>

    <footer>
        &copy; 東武タウンソラマチ株式会社
    </footer>

</body>

</html>
