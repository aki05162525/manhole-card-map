name: Audit

# Dependabot opens no security updates for Bun, and GitHub's dependency graph
# does not read bun.lock, so known advisories for web/ are checked here.
on:
  schedule:
    - cron: "0 0 * * *" # 09:00 JST
  pull_request:
    paths:
      - web/package.json
      - web/bun.lock
      - .github/workflows/audit.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bun:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          sparse-checkout: web
      - uses: jdx/mise-action@v5.2.9
        with:
          version: 2026.11.6
          install_args: bun
      # Reads bun.lock only; no dependency code is installed or run.
      # GHSA-fc5q-39xc-vjpf (picomatch ReDoS) has no fixed release yet. It
      # comes in only through knip, stylelint, vite and vitest, which match
      # globs from this repository's config, never from outside input, and
      # it is not in the production dependencies. Drop the ignore once a
      # picomatch past 4.0.7 is out, and bump it then.
      - run: bun audit --ignore GHSA-fc5q-39xc-vjpf
        working-directory: web
