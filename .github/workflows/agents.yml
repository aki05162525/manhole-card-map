name: Agent skills

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agents-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reproducibility:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Use an isolated APM cache
        run: echo "APM_CACHE_DIR=$RUNNER_TEMP/apm-cache" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned Agent Package Manager
        run: python -m pip install apm-cli==0.35.0
      - name: Restore locked skills
        run: |
          apm install --frozen
          test -f .agents/skills/mapcn/SKILL.md
      - name: Check skill integrity and replay
        run: apm audit --ci
      - name: Verify repeated install is stable
        run: |
          apm install --frozen
          apm audit --ci
      - name: Require unchanged manifest and lockfile
        run: |
          git diff --exit-code -- apm.yml apm.lock.yaml .gitignore
