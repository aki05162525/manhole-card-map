name: Preview
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
  pull-requests: write
concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  # Dependabot PRs get no deploy token: installing an update must not run
  # next to Cloudflare credentials before a person has reviewed it.
  scope:
    if: >-
      vars.CLOUDFLARE_DEPLOY_ENABLED == 'true' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      publish: ${{ steps.scope.outputs.publish }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          sparse-checkout: |
            tools/ci
      - id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python3 -B tools/ci/publish_inputs.py --base "$BASE_SHA"
  preview:
    needs: scope
    if: >-
      needs.scope.outputs.publish == 'true' &&
      vars.CLOUDFLARE_DEPLOY_ENABLED == 'true' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: jdx/mise-action@v5.2.6
        with:
          version: 2026.10.17
          install_args: go node bun
      - run: bun install --frozen-lockfile
        working-directory: web
      - run: python3 -B tools/build-real-data.py
      # No map style override: the CARTO key only allows the production hosts.
      - run: bun run build
        working-directory: web
        env:
          VITE_ACCOUNTS_ENABLED: ${{ vars.VITE_ACCOUNTS_ENABLED }}
          VITE_SCREEN_SWITCH: ${{ vars.VITE_SCREEN_SWITCH }}
      - run: node scripts/check-deploy.mjs
        working-directory: web
      - name: Keep previews out of search results
        working-directory: web
        run: |
          printf '/*\n  X-Robots-Tag: noindex\n' >> dist/_headers
      # A version runs with the bindings of its own config: PR code must never
      # reach the production D1, so previews drop every D1 binding.
      - name: Use a configuration without D1
        working-directory: web
        run: node scripts/wrangler-config.mjs preview wrangler.preview.json
      - name: Upload a version without changing production
        id: upload
        working-directory: web
        env:
          WRANGLER_SEND_METRICS: "false"
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ALIAS: pr-${{ github.event.pull_request.number }}
        run: |
          bun run wrangler versions upload --preview-alias "$ALIAS" --config wrangler.preview.json | tee upload.log
          url=$(grep -oE "https://$ALIAS-[a-z0-9.-]+\.workers\.dev" upload.log | head -1)
          test -n "$url"
          echo "url=$url" >> "$GITHUB_OUTPUT"
      - run: node scripts/smoke-deploy.mjs
        working-directory: web
        env:
          PUBLIC_ORIGIN: ${{ steps.upload.outputs.url }}
          API_HEALTH: disabled
      - name: Comment the preview URL
        env:
          GH_TOKEN: ${{ github.token }}
          URL: ${{ steps.upload.outputs.url }}
          NUMBER: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          gh pr comment "$NUMBER" --repo "$GITHUB_REPOSITORY" --edit-last --create-if-none \
            --body "プレビュー: $URL （コミット ${SHA:0:7}。背景地図はAPIキーなし。検索エンジンには掲載しない）"
