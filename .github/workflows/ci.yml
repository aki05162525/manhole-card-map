name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      frontend: ${{ steps.scope.outputs.frontend }}
      backend: ${{ steps.scope.outputs.backend }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          # Sparse checkout implies blob:none; keep data links but omit evidence.
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/data/evidence/
      - name: Enforce data code policy
        run: python3 -B tools/ci/data_policy.py --ci
      - name: Test change selection, commit hooks and agent guards
        run: |
          python3 -B -m unittest discover -s tools/ci -v
          python3 -B -m unittest discover -s tools/dev -v
          python3 -B -m unittest discover -s tools/agents -v
      - name: Select affected suites
        id: scope
        run: python3 -B tools/ci/changes.py
      - name: Verify workflow dependency lockfile
        if: steps.scope.outputs.workflow_lock == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh extension install github/gh-actions-lock --pin v0.4.1
          gh actions-lock --verify

  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: jdx/mise-action@v5.2.6
        with:
          version: 2026.10.17
          install_args: go
      - uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-${{ runner.os }}-${{ hashFiles('mise.toml', 'go.sum') }}-${{ github.sha }}
          restore-keys: go-${{ runner.os }}-${{ hashFiles('mise.toml', 'go.sum') }}-
      # TestNationalAssemblyFailureGuards runs the entire Python suite.
      # Bypass result caching because Python/data are external Go inputs.
      - name: Go and Python tests
        run: go test -count=1 ./...

  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          # Worker builds bundle the small card registry, without data/evidence.
          # deploy.test.ts reads the preview workflow; contrast tests read tools/design.
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/*/
            /web/
            /tools/dev/
            /tools/ci/
            /tools/design/
            /.github/
            /data/card-ids.json
      - uses: jdx/mise-action@v5.2.6
        with:
          version: 2026.10.17
          install_args: bun node
      - uses: actions/cache@v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('mise.toml', 'web/bun.lock') }}
      - name: Install frontend dependencies
        working-directory: web
        run: bun install --frozen-lockfile
      - name: Commit hook integration with installed Lefthook
        run: python3 -B -m unittest discover -s tools/dev -v
      - name: Lint and format
        working-directory: web
        run: |
          bun run lint
          bun run lint:css
          bun run knip
          bun run format:check
      - name: Vitest
        working-directory: web
        run: bun run test
      - name: Build with explicit synthetic fixtures
        working-directory: web
        run: bun run build:fixture

      - name: Enforce Brotli size budgets (code, CSS, module worker)
        working-directory: web
        run: bun run sizes --fixture --check
