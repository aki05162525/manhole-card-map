name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      frontend: ${{ steps.scope.outputs.frontend }}
      backend: ${{ steps.scope.outputs.backend }}
      offline: ${{ steps.scope.outputs.offline }}
    steps:
      - uses: actions/checkout@v4
      - name: Test change selection and commit hooks
        run: |
          python3 -B -m unittest discover -s tools/ci -v
          python3 -B -m unittest discover -s tools/dev -v
      - name: Select affected suites
        id: scope
        run: python3 -B tools/ci/changes.py

  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v4
        with:
          version: 2026.10.17
          install_args: go
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-${{ runner.os }}-${{ hashFiles('mise.toml', 'go.sum') }}-${{ github.sha }}
          restore-keys: go-${{ runner.os }}-${{ hashFiles('mise.toml', 'go.sum') }}-
      # TestNationalAssemblyFailureGuards runs the entire Python suite.
      # Bypass result caching because Python/data are external Go inputs.
      - name: Go and Python tests
        run: go test -count=1 ./...

  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v4
        with:
          version: 2026.10.17
          install_args: bun node
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('mise.toml', 'web/bun.lock') }}
      - name: Install frontend dependencies
        working-directory: web
        run: bun install --frozen-lockfile
      - name: Commit hook integration with installed Lefthook
        run: python3 -B -m unittest discover -s tools/dev -v
      - name: Lint and format
        working-directory: web
        run: |
          bun run lint
          bun run format:check
      - name: Vitest
        working-directory: web
        run: bun run test
      - name: Build with explicit synthetic fixtures
        working-directory: web
        run: bun run build:fixture
      # Hosted Ubuntu 24.04 already supplies Chromium's shared libraries.
      # Both checks use headless shell; skip full Chromium and apt/font setup.
      - name: Install headless browser for integration checks
        working-directory: web
        run: bunx --no-install playwright install --only-shell chromium
      - name: Browser checks with synthetic cards
        working-directory: web
        run: node scripts/browser-check.mjs
      - name: Fetch immutable legacy worker for regression
        if: needs.changes.outputs.offline == 'true'
        run: git fetch --no-tags --depth=1 origin cebbcbc42d6d2cf51a8fb6f47616bb5b58824fd8
      - name: Offline update browser regression
        if: needs.changes.outputs.offline == 'true'
        working-directory: web
        run: node scripts/offline-browser-check.mjs
      - name: Save browser evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-mapcn-${{ github.sha }}
          path: web/results/mapcn-check-*.png
          if-no-files-found: ignore
          retention-days: 7

  # Preserve the existing required-check name, including documentation-only PRs.
  checks:
    if: always()
    needs: [changes, backend, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require successful affected suites
        env:
          CHANGES: ${{ needs.changes.result }}
          BACKEND: ${{ needs.backend.result }}
          FRONTEND: ${{ needs.frontend.result }}
        run: |
          test "$CHANGES" = success
          case "$BACKEND" in success|skipped) ;; *) exit 1 ;; esac
          case "$FRONTEND" in success|skipped) ;; *) exit 1 ;; esac
