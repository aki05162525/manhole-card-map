name: Deploy
on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cloudflare-production
  cancel-in-progress: false
jobs:
  scope:
    if: >-
      vars.CLOUDFLARE_DEPLOY_ENABLED == 'true' &&
      ((github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      publish: ${{ steps.scope.outputs.publish }}
      marker: ${{ steps.scope.outputs.marker }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/*/
            /tools/ci/
            /web/package.json
            /web/bun.lock
      - uses: jdx/mise-action@v4
        with:
          version: 2026.10.17
          install_args: node bun
      - id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          VITE_MAP_STYLE_URL: ${{ vars.VITE_MAP_STYLE_URL }}
          PUBLIC_RELEASE: ${{ vars.PUBLIC_RELEASE }}
          PUBLIC_ORIGIN: ${{ vars.PUBLIC_ORIGIN }}
          WRANGLER_SEND_METRICS: "false"
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ "$EVENT_NAME" = workflow_dispatch ]; then
            python3 -B tools/ci/publish_inputs.py --production --force
          else
            python3 -B tools/ci/publish_inputs.py --production
          fi
  # Retain the Access guard even when no upload/build is needed.
  access:
    needs: scope
    if: needs.scope.outputs.publish == 'false' && vars.PUBLIC_RELEASE != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/*/
            /web/scripts/smoke-deploy.mjs
      - uses: jdx/mise-action@v4
        with:
          version: 2026.10.17
          install_args: node
      - run: node scripts/smoke-deploy.mjs --access-only
        working-directory: web
        env:
          PUBLIC_ORIGIN: ${{ vars.PUBLIC_ORIGIN }}
  deploy:
    needs: scope
    if: >-
      needs.scope.outputs.publish == 'true' &&
      vars.CLOUDFLARE_DEPLOY_ENABLED == 'true' &&
      ((github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: jdx/mise-action@v4
        with:
          version: 2026.10.17
          install_args: go node bun
      - run: bun install --frozen-lockfile
        working-directory: web
      - run: python3 -B tools/build-real-data.py
      - run: bun run build
        working-directory: web
        env:
          VITE_MAP_STYLE_URL: ${{ vars.VITE_MAP_STYLE_URL }}
      - run: node scripts/check-deploy.mjs
        working-directory: web
      # Until public release, refuse to upload unless anonymous visitors are blocked.
      - if: vars.PUBLIC_RELEASE != 'true'
        run: node scripts/smoke-deploy.mjs --access-only
        working-directory: web
        env:
          PUBLIC_ORIGIN: ${{ vars.PUBLIC_ORIGIN }}
      - run: bun run wrangler deploy --message "$PUBLISH_MARKER"
        working-directory: web
        env:
          PUBLISH_MARKER: ${{ needs.scope.outputs.marker }}
          WRANGLER_SEND_METRICS: "false"
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - run: node scripts/smoke-deploy.mjs
        working-directory: web
        env:
          PUBLIC_ORIGIN: ${{ vars.PUBLIC_ORIGIN }}
          ACCESS_REQUIRED: ${{ vars.PUBLIC_RELEASE != 'true' }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
