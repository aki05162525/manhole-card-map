# Saved terms pages carry the browser keys that municipal and tourism sites
# embed for their own maps. They are not credentials of this project, so the
# page bodies stay out of alerts and push protection. Other files are still
# scanned: a key there may be ours, so review each new hit before adding its
# file here.
paths-ignore:
  - "data/terms/**/*.html"
  - "data/terms/**/*.raw"
  - "data/terms/**/*.bin"
