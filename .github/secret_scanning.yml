# Saved source pages carry the browser keys that municipal sites embed for
# their own maps. They are not credentials of this project, so the page
# bodies, and the existing notes quoting them, stay out of alerts and push
# protection. Fetch metadata and new notes are still scanned: a key there may
# be ours, so review each new hit before adding its file here.
paths-ignore:
  - "data/evidence/**/*.html"
  - "data/evidence/**/*.raw"
  - "data/evidence/**/*.bin"
  - "data/evidence/issue5/north-kanto/inventory.json"
  - "data/evidence/national/kanto-north/map-inspections.json"
  - "data/evidence/national/kanto-south-locations-chiba/manifest.json"
  - "data/evidence/national/kanto-south-locations-kanagawa/manifest.json"
  - "data/evidence/national/kanto-south-locations-tokyo/extra-candidates.txt"
  - "data/evidence/national/locations-chubu-west/adopted-manifest.json"
  - "data/evidence/national/locations-chubu-west/assessments.json"
  - "data/evidence/national/locations-chubu-west/embedded-links.json"
  - "data/evidence/national/locations-chubu-west/manifest.json"
  - "data/evidence/national/locations-chubu-west/provenance.json"
  - "data/evidence/national/locations-kanto-north-saitama/cache-scan.txt"
