# Run from the repository root. Install explicitly with: cd web && bun run hooks:install
lefthook: web/node_modules/.bin/lefthook
pre-commit:
  parallel: true
  commands:
    data-policy:
      run: python3 -B tools/ci/data_policy.py --staged
    ledger-history:
      run: python3 -B tools/ci/ledger_history.py --staged
    frontend:
      run: python3 -B tools/dev/check_staged.py frontend
    go-test:
      run: python3 -B tools/dev/check_staged.py go
    hook-tests:
      run: python3 -B tools/dev/check_staged.py hooks
# Unit suites run in CI; browser checks are manual. No pre-push checks.
